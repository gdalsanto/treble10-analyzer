[project]
name = "treble10-analyzer"
version = "0.1.0"
description = "Tools to download, convert, and analyze the Treble10-RIR dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "scipy<1.17",  # spaudiopy's sh_matrix() still calls scipy.special.sph_harm, removed in scipy 1.17
    "datasets",
    "torch",
    "torchcodec",
    "soundfile",
    "flareverb",
    "matplotlib",
    "pyfar",
    "multislope",
    "spaudiopy"
]

# ffmpeg (<7) is required by torchcodec/soundfile for audio decoding but is a
# system binary, not a pip package. Install it separately, e.g.:
#   macOS:  brew install "ffmpeg@6"
#   Ubuntu: apt install ffmpeg

[project.optional-dependencies]
notebook = [
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["treble10_analyzer"]
include = ["rir_hoa.py", "t60_analysis.py"]
